<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texas Sites — Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f1e8;
      color: #2d2a26;
    }
    .card {
      width: min(520px, calc(100% - 32px));
      padding: 32px;
      background: #fff;
      border: 1px solid #ddd5c7;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; }
    p { color: #6b655c; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cfc7b9;
      border-radius: 8px;
      font: inherit;
      font-size: 16px;
    }
    textarea {
      min-height: 130px;
      resize: vertical;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #8f1d14;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .message { min-height: 24px; margin-top: 16px; }
    .success { color: #28723b; }
    .error { color: #a61b1b; }
    .hidden { display: none; }
    .section-title {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #e5dfd5;
    }
  </style>
</head>
<body>
  <main class="card">
    <section id="login">
      <h1>Texas Sites Admin</h1>
      <p>Sign in to manage Texas Sites.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button id="loginButton" type="submit">Sign In</button>
        <div id="message" class="message"></div>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <h1>Welcome, Ernest</h1>
      <p>You are signed in to the Texas Sites admin area.</p>

      <div class="section-title">
        <h2>Add Testimonial</h2>
        <p>Enter the name of the customer and their testimonial.</p>

        <form id="testimonialForm">
          <label for="customerName">Customer Name</label>
          <input
            id="customerName"
            type="text"
            autocomplete="name"
            maxlength="200"
            required
          >

          <label for="testimonial">Testimonial</label>
          <textarea
            id="testimonial"
            maxlength="2000"
            required
          ></textarea>

          <button id="testimonialButton" type="submit">
            Add Testimonial
          </button>

          <div id="testimonialMessage" class="message"></div>
        </form>
      </div>

      <button id="signOutButton" type="button">Sign Out</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDD5SyZaQsPb9zaT4gPsXLEaOCf3G2a8n8",
      authDomain: "texas-sites01.firebaseapp.com",
      projectId: "texas-sites01",
      storageBucket: "texas-sites01.firebasestorage.app",
      messagingSenderId: "549305952452",
      appId: "1:549305952452:web:867948363073fc7c320191",
      measurementId: "G-S4JQB59971"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const login = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    const testimonialForm = document.getElementById("testimonialForm");
    const testimonialButton = document.getElementById("testimonialButton");
    const testimonialMessage = document.getElementById("testimonialMessage");

    // UI-level restriction. The Cloud Function performs the real authentication.
    const ADMIN_EMAIL = "ernestdurda@gmail.com";

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        login.classList.remove("hidden");
        dashboard.classList.add("hidden");
        return;
      }

      if (user.email !== ADMIN_EMAIL) {
        await signOut(auth);
        message.textContent = "This account is not authorized for the admin area.";
        message.className = "message error";
        return;
      }

      login.classList.add("hidden");
      dashboard.classList.remove("hidden");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      message.className = "message";
      button.disabled = true;

      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
      } catch (error) {
        message.textContent = "Sign-in failed. Check your email and password.";
        message.className = "message error";
      } finally {
        button.disabled = false;
      }
    });

    testimonialForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      testimonialMessage.textContent = "";
      testimonialMessage.className = "message";
      testimonialButton.disabled = true;

      try {
        const user = auth.currentUser;

        if (!user) {
          throw new Error("You are not signed in.");
        }

        const token = await user.getIdToken(true);

        const response = await fetch(
          "https://us-central1-texas-sites01.cloudfunctions.net/addTestimonial",
          {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              customerName: document.getElementById("customerName").value.trim(),
              testimonial: document.getElementById("testimonial").value.trim()
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Unable to add testimonial.");
        }

        testimonialMessage.textContent = "Testimonial added successfully.";
        testimonialMessage.className = "message success";

        testimonialForm.reset();
      } catch (error) {
        console.error("Add testimonial error:", error);
        testimonialMessage.textContent =
          error.message || "Unable to add testimonial.";
        testimonialMessage.className = "message error";
      } finally {
        testimonialButton.disabled = false;
      }
    });

    document.getElementById("signOutButton").addEventListener("click", () => {
      signOut(auth);
    });
  </script>
</body>
</html>
