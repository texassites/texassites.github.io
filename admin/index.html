<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texas Sites — Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f1e8;
      color: #2d2a26;
    }
    .card {
      width: min(420px, calc(100% - 32px));
      padding: 32px;
      background: #fff;
      border: 1px solid #ddd5c7;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; }
    p { color: #6b655c; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cfc7b9;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #8f1d14;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .message { min-height: 24px; margin-top: 16px; }
    .error { color: #a61b1b; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <section id="login">
      <h1>Texas Sites Admin</h1>
      <p>Sign in to manage Texas Sites.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button id="loginButton" type="submit">Sign In</button>
        <div id="message" class="message"></div>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <h1>Welcome, Ernest</h1>
      <p>You are signed in to the Texas Sites admin area.</p>
      <button id="signOutButton" type="button">Sign Out</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDD5SyZaQsPb9zaT4gPsXLEaOCf3G2a8n8",
      authDomain: "texas-sites01.firebaseapp.com",
      projectId: "texas-sites01",
      storageBucket: "texas-sites01.firebasestorage.app",
      messagingSenderId: "549305952452",
      appId: "1:549305952452:web:867948363073fc7c320191",
      measurementId: "G-S4JQB59971"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const login = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    // UI-level restriction. Firestore Security Rules remain the real protection.
    const ADMIN_EMAIL = "ernestdurda@gmail.com";

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        login.classList.remove("hidden");
        dashboard.classList.add("hidden");
        return;
      }

      if (user.email !== ADMIN_EMAIL) {
        await signOut(auth);
        message.textContent = "This account is not authorized for the admin area.";
        message.className = "message error";
        return;
      }

      login.classList.add("hidden");
      dashboard.classList.remove("hidden");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;

      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
      } catch (error) {
        message.textContent = "Sign-in failed. Check your email and password.";
        message.className = "message error";
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("signOutButton").addEventListener("click", () => {
      signOut(auth);
    });
  </script>
</body>
</html>
