<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texas Sites — Admin</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f1e8;
      color: #2d2a26;
    }
    .admin-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .admin-card {
      background: #fff;
      border: 1px solid #ddd5c7;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }
    .form-control {
      border-color: #cfc7b9;
    }
    .form-control:focus {
      border-color: #8f1d14;
      box-shadow: 0 0 0 .2rem rgba(143,29,20,.12);
    }
    .btn-texas {
      background: #8f1d14;
      border-color: #8f1d14;
      color: #fff;
    }
    .btn-texas:hover {
      background: #741710;
      border-color: #741710;
      color: #fff;
    }
    .testimonial-card {
      height: 100%;
      border: 1px solid #ddd5c7;
      border-radius: 12px;
      background: #fff;
    }
    .testimonial-text {
      white-space: pre-wrap;
    }
    .testimonial-meta {
      font-size: .85rem;
      color: #6b655c;
    }
    .empty-state {
      color: #6b655c;
      background: #faf8f4;
      border: 1px dashed #cfc7b9;
      border-radius: 12px;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="admin-shell">
    <section id="login" class="admin-card p-4 p-md-5 mx-auto" style="max-width: 520px;">
      <h1 class="h2 mb-2">Texas Sites Admin</h1>
      <p class="text-secondary">Sign in to manage Texas Sites.</p>

      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email</label>
          <input id="email" type="email" class="form-control" autocomplete="username" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>

        <button id="loginButton" type="submit" class="btn btn-texas w-100">
          Sign In
        </button>

        <div class="text-center mt-3">
          <button id="forgotPasswordButton" type="button" class="btn btn-link p-0">
            Forgot your password?
          </button>
        </div>

        <div id="message" class="mt-3"></div>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <div class="admin-card p-4 p-md-5 mb-4">
        <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
          <div>
            <h1 class="h2 mb-2">Welcome, Ernest</h1>
            <p class="text-secondary mb-0">
              Manage testimonials for your site.
            </p>
          </div>
          <button id="signOutButton" type="button" class="btn btn-outline-secondary">
            Sign Out
          </button>
        </div>

        <hr class="my-4">

        <h2 class="h4">Add Testimonial</h2>
        <p class="text-secondary">
          Enter the name of the customer and their testimonial.
        </p>

        <form id="testimonialForm">
          <div class="mb-3">
            <label for="customerName" class="form-label fw-semibold">
              Customer Name
            </label>
            <input
              id="customerName"
              type="text"
              class="form-control"
              autocomplete="name"
              maxlength="200"
              required
            >
          </div>

          <div class="mb-3">
            <label for="testimonial" class="form-label fw-semibold">
              Testimonial
            </label>
            <textarea
              id="testimonial"
              class="form-control"
              rows="5"
              maxlength="2000"
              required
            ></textarea>
          </div>

          <button id="testimonialButton" type="submit" class="btn btn-texas">
            Add Testimonial
          </button>

          <div id="testimonialMessage" class="mt-3"></div>
        </form>
      </div>

      <div class="mb-3">
        <h2 class="h4 mb-1">Your Testimonials</h2>
        <p id="siteLabel" class="text-secondary mb-0"></p>
      </div>

      <div id="testimonialsLoading" class="text-secondary py-3">
        Loading testimonials...
      </div>

      <div id="testimonialsEmpty" class="empty-state p-4 hidden">
        No testimonials have been added yet.
      </div>

      <div id="testimonialsGrid" class="row g-4"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDD5SyZaQsPb9zaT4gPsXLEaOCf3G2a8n8",
      authDomain: "texas-sites01.firebaseapp.com",
      projectId: "texas-sites01",
      storageBucket: "texas-sites01.firebasestorage.app",
      messagingSenderId: "549305952452",
      appId: "1:549305952452:web:867948363073fc7c320191",
      measurementId: "G-S4JQB59971"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const login = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const forgotPasswordButton =
      document.getElementById("forgotPasswordButton");
    const message = document.getElementById("message");

    const testimonialForm = document.getElementById("testimonialForm");
    const testimonialButton = document.getElementById("testimonialButton");
    const testimonialMessage = document.getElementById("testimonialMessage");

    const testimonialsLoading =
      document.getElementById("testimonialsLoading");
    const testimonialsEmpty =
      document.getElementById("testimonialsEmpty");
    const testimonialsGrid =
      document.getElementById("testimonialsGrid");
    const siteLabel = document.getElementById("siteLabel");

    const ADMIN_EMAIL = "ernestdurda@gmail.com";

    const TESTIMONIALS_URL =
      "https://raw.githubusercontent.com/texassites/texassites.github.io/main/testimonials/testimonials.json";

    function escapeHtml(value) {
      return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString();
    }

    async function loadTestimonials(user) {
      testimonialsLoading.classList.remove("hidden");
      testimonialsEmpty.classList.add("hidden");
      testimonialsGrid.innerHTML = "";

      try {
        const tokenResult = await user.getIdTokenResult(true);
        const site = tokenResult.claims.site;

        if (!site || typeof site !== "string") {
          throw new Error("No site is assigned to this account.");
        }

        siteLabel.textContent = `Site: ${site}`;

        const response = await fetch(
          `${TESTIMONIALS_URL}?t=${Date.now()}`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Unable to load testimonials.");
        }

        const allTestimonials = await response.json();
        const testimonials = Array.isArray(allTestimonials[site]) ?
          allTestimonials[site] :
          [];

        testimonialsLoading.classList.add("hidden");

        if (testimonials.length === 0) {
          testimonialsEmpty.classList.remove("hidden");
          return;
        }

        testimonials.slice().reverse().forEach((item) => {
          const column = document.createElement("div");
          column.className = "col-12 col-md-6 col-lg-4";

          column.innerHTML = `
            <article class="testimonial-card p-4">
              <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                <h3 class="h5 mb-0">${escapeHtml(item.customerName)}</h3>
                <span class="badge text-bg-success">Published</span>
              </div>

              <p class="testimonial-text mb-4">
                “${escapeHtml(item.testimonial)}”
              </p>

              <div class="testimonial-meta">
                Added ${escapeHtml(formatDate(item.created))}
              </div>
            </article>
          `;

          testimonialsGrid.appendChild(column);
        });
      } catch (error) {
        console.error("Load testimonials error:", error);
        testimonialsLoading.classList.add("hidden");
        testimonialsEmpty.classList.remove("hidden");
        testimonialsEmpty.textContent =
          error.message || "Unable to load testimonials.";
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        login.classList.remove("hidden");
        dashboard.classList.add("hidden");
        return;
      }

      if (user.email !== ADMIN_EMAIL) {
        await signOut(auth);
        message.textContent =
          "This account is not authorized for the admin area.";
        message.className = "mt-3 text-danger";
        return;
      }

      login.classList.add("hidden");
      dashboard.classList.remove("hidden");

      await loadTestimonials(user);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;

      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
      } catch (error) {
        message.textContent =
          "Sign-in failed. Check your email and password.";
        message.className = "mt-3 text-danger";
      } finally {
        button.disabled = false;
      }
    });

    forgotPasswordButton.addEventListener("click", async () => {
      message.textContent = "";
      message.className = "mt-3";
      forgotPasswordButton.disabled = true;

      try {
        const email = document.getElementById("email").value.trim();

        if (!email) {
          throw new Error(
              "Enter your email address above, then click Forgot your password."
          );
        }

        await sendPasswordResetEmail(auth, email);

        message.textContent =
          "If an account exists for that email address, a password reset email has been sent.";
        message.className = "mt-3 text-success fw-semibold";
      } catch (error) {
        if (error.code === "auth/invalid-email") {
          message.textContent = "Enter a valid email address.";
        } else {
          message.textContent =
            error.message ||
            "Unable to send the password reset email.";
        }

        message.className = "mt-3 text-danger";
      } finally {
        forgotPasswordButton.disabled = false;
      }
    });

    testimonialForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      testimonialMessage.textContent = "";
      testimonialMessage.className = "";
      testimonialButton.disabled = true;

      try {
        const user = auth.currentUser;

        if (!user) {
          throw new Error("You are not signed in.");
        }

        const token = await user.getIdToken(true);

        const response = await fetch(
          "https://us-central1-texas-sites01.cloudfunctions.net/addTestimonial",
          {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              customerName:
                document.getElementById("customerName").value.trim(),
              testimonial:
                document.getElementById("testimonial").value.trim()
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
              result.error || "Unable to add testimonial."
          );
        }

        testimonialMessage.textContent =
          "Testimonial added successfully.";
        testimonialMessage.className = "mt-3 text-success fw-semibold";

        testimonialForm.reset();

        await loadTestimonials(user);
      } catch (error) {
        console.error("Add testimonial error:", error);
        testimonialMessage.textContent =
          error.message || "Unable to add testimonial.";
        testimonialMessage.className = "mt-3 text-danger";
      } finally {
        testimonialButton.disabled = false;
      }
    });

    document.getElementById("signOutButton").addEventListener(
        "click",
        () => {
          signOut(auth);
        }
    );
  </script>
</body>
</html>
