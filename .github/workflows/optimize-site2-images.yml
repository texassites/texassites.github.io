name: Optimize Site 2 Images

on:
  push:
    paths:
      - 'img/cutting-wood-by-window.jpg'
      - 'img/guy-on-ladder-1.jpg'
      - 'img/guy-on-ladder-outside-painting-wall-logo-or-something.jpg'
      - 'img/kithen-cabinet0install.jpg'
      - 'img/rustic-tools-sawdust-01.jpg'
      - 'img/wall-window-frame-work.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Optimize Site 2 photos
        run: |
          python -m pip install --quiet Pillow
          python <<'PY'
          from PIL import Image
          from pathlib import Path

          files = [
              "cutting-wood-by-window.jpg",
              "guy-on-ladder-1.jpg",
              "guy-on-ladder-outside-painting-wall-logo-or-something.jpg",
              "kithen-cabinet0install.jpg",
              "rustic-tools-sawdust-01.jpg",
              "wall-window-frame-work.jpg",
          ]

          src = Path("img")
          dst = src / "site2-optimized"
          dst.mkdir(exist_ok=True)

          for name in files:
              with Image.open(src / name) as im:
                  im = im.convert("RGB")
                  im.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  im.save(dst / name, "JPEG", quality=82, optimize=True, progressive=True)
          PY

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/site2-optimized/
          if git diff --cached --quiet; then
            echo "No optimized image changes."
            exit 0
          fi
          git commit -m "Optimize Site 2 images for web"
          git push
